name: Build isolated staging images

on:
  push:
    branches: [infra/staging-deployment]
    paths:
      - infra/build/**
      - infra/tests/**
      - infra/coolify/**
      - infra/redis/**
      - infra/rabbitmq/**
      - infra/clickhouse/**
      - infra/versions.lock.yml
      - scripts/ops/**
      - .github/workflows/build-staging.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hablas-evo-staging-release-build
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'golevel-ai/hablas-crm' && github.ref == 'refs/heads/infra/staging-deployment'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      build_images: ${{ steps.plan.outputs.build_images }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.20.0
      - name: Reuse already verified images when only operational metadata changed
        id: plan
        run: |
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts/ops')
          from prepare_builds import RECIPES, recipe_digest
          lock = json.loads(Path('infra/versions.lock.yml').read_text())
          recipe = recipe_digest()
          needed = lock.get('release', {}).get('recipe_sha256') != recipe
          for service, (source, _) in RECIPES.items():
              image = lock.get('images', {}).get(service, {})
              commit = lock['commit'] if service == 'gateway' else lock['submodules'][source]
              needed |= image.get('source_commit') != commit or image.get('recipe_sha256') != recipe
              needed |= image.get('verification') != 'ANONYMOUS_PULL_AND_DIGEST_VERIFIED'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"build_images={'true' if needed else 'false'}\n")
          PY
      - name: Validate deployment policy and source identity
        run: |
          python3 -m unittest discover -s scripts/ops -p 'test_*.py' -v
          bash scripts/ops/validate.sh --target infra/environment.target.yml
          docker compose -f infra/coolify/compose.app.yml config --no-interpolate --quiet
          docker compose -f infra/coolify/compose.data.yml config --no-interpolate --quiet
          node --test scripts/ops/test_tls.cjs
          node --check scripts/ops/verify_main.cjs
          node --check scripts/ops/verify_main_completion.cjs
          node --check scripts/ops/rotate_exposed_predeployment.cjs
          node scripts/ops/rotate_exposed_predeployment.cjs --self-test
          python3 -m py_compile scripts/ops/rotate_data_credentials_host.py scripts/ops/smoke_r2.py
          node --check scripts/ops/verify_main.cjs
          python3 -m py_compile scripts/ops/bootstrap_main_host.py scripts/ops/bootstrap_processor_alembic.py scripts/ops/bootstrap_processor.py
      - name: Prepare immutable EvoFlow source context
        id: context
        run: |
          python3 scripts/ops/prepare_builds.py --target infra/environment.target.yml --service evoflow
          RECIPE=$(python3 -c "import sys; sys.path.insert(0, 'scripts/ops'); from prepare_builds import recipe_digest; print(recipe_digest())")
          echo "directory=.ops-private/build/$RECIPE/evoflow" >> "$GITHUB_OUTPUT"
      - name: Build EvoFlow with locked dependencies
        working-directory: ${{ steps.context.outputs.directory }}
        run: npm ci --ignore-scripts --no-audit --no-fund && npm run build
      - name: Prepare disposable local PostgreSQL test tools
        working-directory: infra/tests
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Restore reviewed native library symlinks
        working-directory: infra/tests/node_modules/@embedded-postgres/linux-x64
        run: node scripts/hydrate-symlinks.js
      - name: Test schema migrations and cross-schema denial locally
        run: node infra/tests/evoflow-schema.mjs "${{ steps.context.outputs.directory }}"

  images:
    needs: verify
    if: needs.verify.outputs.build_images == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        service: [gateway, auth, crm, core, processor, bot, evoflow]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Generate versioned deployment context
        id: context
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          python3 scripts/ops/prepare_builds.py --target infra/environment.target.yml --service "$SERVICE"
          RECIPE=$(python3 -c "import sys; sys.path.insert(0, 'scripts/ops'); from prepare_builds import recipe_digest; print(recipe_digest())")
          DOCKERFILE=$(python3 -c "import os,sys; sys.path.insert(0, 'scripts/ops'); from prepare_builds import RECIPES; print(RECIPES[os.environ['SERVICE']][1])")
          echo "directory=.ops-private/build/$RECIPE/$SERVICE" >> "$GITHUB_OUTPUT"
          echo "dockerfile=.ops-private/build/$RECIPE/$SERVICE/$DOCKERFILE" >> "$GITHUB_OUTPUT"
          echo "recipe=$RECIPE" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite an existing release tag
        env:
          IMAGE: ghcr.io/golevel-ai/hablas-evo-staging-${{ matrix.service }}:${{ github.sha }}
        run: |
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo 'Release tag already exists. Use a new reviewed infrastructure commit.' >&2
            exit 1
          fi
      - name: Build and publish only this release tag
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ steps.context.outputs.directory }}
          file: ${{ steps.context.outputs.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/golevel-ai/hablas-evo-staging-${{ matrix.service }}:${{ github.sha }}
          provenance: mode=max
          build-args: |
            RAILS_ENV=production
            GIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/golevel-ai/hablas-crm
            org.opencontainers.image.revision=${{ github.sha }}
            io.golevel.project=hablas-evo-infra
            io.golevel.recipe=${{ steps.context.outputs.recipe }}
      - name: Record the returned image digest
        env:
          SERVICE: ${{ matrix.service }}
          DIGEST: ${{ steps.build.outputs.digest }}
          RECIPE: ${{ steps.context.outputs.recipe }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          assert re.fullmatch(r'sha256:[a-f0-9]{64}', os.environ['DIGEST'])
          service = os.environ['SERVICE']
          source = json.loads(Path(f".ops-private/build/{os.environ['RECIPE']}/{service}/hablas-build.json").read_text())
          source.pop('files_sha256')
          source['reference'] = f"ghcr.io/golevel-ai/hablas-evo-staging-{service}@{os.environ['DIGEST']}"
          Path(f'image-{service}.json').write_text(json.dumps(source, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-${{ matrix.service }}
          path: image-${{ matrix.service }}.json
          retention-days: 7

  primary-bootstrap-contract:
    needs: [verify, images]
    if: always() && needs.verify.result == 'success' && (needs.images.result == 'success' || needs.images.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Select this build or the already verified immutable release
        env:
          BUILT: ${{ needs.verify.outputs.build_images }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          lock = json.loads(Path('infra/versions.lock.yml').read_text())
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              for service in ('auth', 'crm', 'core', 'processor'):
                  reference = (f"ghcr.io/golevel-ai/hablas-evo-staging-{service}:{os.environ['GITHUB_SHA']}"
                               if os.environ['BUILT'] == 'true' else lock['images'][service]['reference'])
                  out.write(f'{service.upper()}_IMAGE={reference}\n')
          PY
      - name: Test primary bootstrap with no production credentials or external access
        run: bash infra/tests/primary-bootstrap.sh
