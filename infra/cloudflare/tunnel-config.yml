# Locally-managed Cloudflare Tunnel for the production API host.
#
# The ingress rules live here, in version control, instead of in the dashboard so
# that every change is reviewable. Reference:
# https://developers.cloudflare.com/tunnel/features/locally-managed-tunnels/configuration-file/
# https://developers.cloudflare.com/tunnel/reference/origin-parameters/
#
# TUNNEL_ID is substituted at deploy time; the credentials file is mounted read-only
# and never committed. See docs/production-rename-runbook.md.

tunnel: ${TUNNEL_ID}
credentials-file: /etc/cloudflared/credentials.json

# Do not let the container silently replace the reviewed binary.
no-autoupdate: true

# /ready on this port backs the container healthcheck.
metrics: 0.0.0.0:2000

# Cloudflare terminates TLS at the edge. The hop from cloudflared to the gateway
# stays inside the Docker network, so it is plain HTTP by design.
originRequest:
  connectTimeout: 30s
  tcpKeepAlive: 30s
  # ActionCable (/cable) and the processor SSE stream stay open far longer than the
  # 1m30s default. This only governs idle pooled connections, but raising it avoids
  # churning sockets under the long-lived traffic this API serves.
  keepAliveTimeout: 5m
  keepAliveConnections: 200
  # The gateway routes on Host; preserve the client value rather than rewriting it.
  httpHostHeader: ""
  disableChunkedEncoding: false
  noTLSVerify: false

ingress:
  - hostname: api-crm.hablas.chat
    service: http://hablas-evo-production-gateway:80

  # Anything that reaches the connector without matching the rule above is not part
  # of this deployment. Fail closed rather than exposing an unintended origin.
  - service: http_status:404
