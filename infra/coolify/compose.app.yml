# Images MUST be built from prepare_builds.py contexts; see their hablas-build.json.
# No Dockerfile/build here: release images are built outside the shared destination.
name: hablas-evo-app-staging

x-common: &common
  platform: linux/amd64
  restart: "on-failure:3"
  stop_grace_period: 60s
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
  labels:
    io.golevel.project: hablas-evo-infra
    io.golevel.environment: staging
    io.golevel.owner: ${DEPLOYMENT_OWNER:?Recorded ownership marker required}

x-main-db: &main-db
  POSTGRES_HOST: ${MAIN_DB_HOST:?Verified Supabase Connect host required}
  POSTGRES_PORT: ${MAIN_DB_PORT:?Verified port required}
  POSTGRES_DATABASE: ${MAIN_DB_NAME:?Verified database required}
  POSTGRES_USERNAME: ${MAIN_DB_USER:?Runtime role required}
  POSTGRES_PASSWORD: ${MAIN_DB_PASSWORD:?Runtime password required}
  PGSSLMODE: verify-full
  PGSSLROOTCERT: /run/configs/main-db-ca.pem

x-storage: &storage
  ACTIVE_STORAGE_SERVICE: s3_compatible
  STORAGE_BUCKET_NAME: ${STORAGE_BUCKET_NAME:?Dedicated private R2 bucket required}
  STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:?Restricted R2 credential required}
  STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:?Restricted R2 credential required}
  STORAGE_REGION: auto
  STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:?Verified HTTPS R2 endpoint required}
  ACTIVE_STORAGE_URL: ${API_ORIGIN:?Validated HTTPS origin required}

x-rails: &rails
  <<: [*main-db, *storage]
  RAILS_ENV: production
  RUN_MIGRATIONS: "false"
  RAILS_LOG_TO_STDOUT: "true"
  RAILS_MAX_THREADS: "3"
  RAILS_MIN_THREADS: "1"
  WEB_CONCURRENCY: "0"
  SIDEKIQ_CONCURRENCY: "3"
  SECRET_KEY_BASE: ${SECRET_KEY_BASE:?Shared Rails secret required}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Shared signing secret required}
  EVOAI_CRM_API_TOKEN: ${EVOAI_CRM_API_TOKEN:?Shared integration secret required}
  FRONTEND_URL: ${FRONTEND_ORIGIN:?Validated HTTPS frontend origin required}
  BACKEND_URL: ${API_ORIGIN:?Validated HTTPS API origin required}
  CORS_ORIGINS: ${FRONTEND_ORIGIN:?},${API_ORIGIN:?}

x-auth-env: &auth-env
  <<: *rails
  PORT: "3001"
  REDIS_URL: ${AUTH_REDIS_URL:?Authenticated Redis DB1 URI required}
  DOORKEEPER_JWT_SECRET_KEY: ${DOORKEEPER_JWT_SECRET_KEY:?Shared Auth secret required}
  DOORKEEPER_JWT_ALGORITHM: hs256
  DOORKEEPER_JWT_ISS: evo-auth-service
  ACCEPT_REFRESH_TOKEN_AS_ACCESS_TOKEN: "false"
  SMTP_ADDRESS: ${SMTP_ADDRESS:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_DOMAIN: ${SMTP_DOMAIN:-}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_AUTHENTICATION: plain
  SMTP_ENABLE_STARTTLS_AUTO: "true"
  MAILER_SENDER_EMAIL: ${MAILER_SENDER_EMAIL:-}

x-crm-env: &crm-env
  <<: *rails
  PORT: "3000"
  REDIS_URL: ${CRM_REDIS_URL:?Authenticated Redis DB0 URI required}
  DB_PGBOUNCER: "false"
  EVO_AI_ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Shared Fernet key required}
  EVO_AUTH_SERVICE_URL: ${AUTH_INTERNAL_ORIGIN:?Observed internal DNS required}
  EVO_AI_CORE_SERVICE_URL: ${CORE_INTERNAL_ORIGIN:?Observed internal DNS required}
  BOT_RUNTIME_URL: ${BOT_INTERNAL_ORIGIN:?Observed internal DNS required}
  BOT_RUNTIME_POSTBACK_BASE_URL: ${CRM_INTERNAL_ORIGIN:?Observed internal DNS required}
  BOT_RUNTIME_SECRET: ${BOT_RUNTIME_SECRET:?Shared Bot secret required}
  EVO_FLOW_ENABLED: "true"
  EVO_FLOW_API_URL: ${EVOFLOW_INTERNAL_ORIGIN:?Observed internal DNS required}/api/v1
  EVO_FLOW_ALLOW_INSECURE: "true"
  AUTH_APIKEY_INTEGRATION_LOCAL: ${AUTH_APIKEY_INTEGRATION_LOCAL:?Shared CRM-EvoFlow secret required}
  DISABLE_TELEMETRY: "true"
  ENABLE_ACCOUNT_SIGNUP: "false"
  LOG_LEVEL: info

services:
  hablas-evo-staging-gateway:
    <<: *common
    image: ${GATEWAY_IMAGE:?Verified recipe image digest required}
    mem_limit: 128m
    cpus: 0.25
    environment:
      AUTH_UPSTREAM: ${AUTH_UPSTREAM:?Observed host and port required}
      CRM_UPSTREAM: ${CRM_UPSTREAM:?Observed host and port required}
      CORE_UPSTREAM: ${CORE_UPSTREAM:?Observed host and port required}
      PROCESSOR_UPSTREAM: ${PROCESSOR_UPSTREAM:?Observed host and port required}
      BOT_RUNTIME_UPSTREAM: ${BOT_RUNTIME_UPSTREAM:?Observed host and port required}
      EVOFLOW_UPSTREAM: ${EVOFLOW_UPSTREAM:?Observed host and port required}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?}
      API_ORIGIN: ${API_ORIGIN:?}
    expose: ["3030"]
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 && nginx -t -q"]
      interval: 30s
      timeout: 5s
      retries: 3

  hablas-evo-staging-auth:
    <<: *common
    image: ${AUTH_IMAGE:?Verified recipe image digest required}
    entrypoint: ["sh", "infra/rails-entrypoint.sh"]
    command: ["bundle", "exec", "rails", "server", "-b", "0.0.0.0", "-p", "3001"]
    mem_limit: 512m
    cpus: 0.5
    environment:
      <<: *auth-env
      SERVICE_ROLE: web
    configs:
      - {source: main-db-ca, target: /run/configs/main-db-ca.pem}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "4", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  hablas-evo-staging-auth-sidekiq:
    <<: *common
    image: ${AUTH_IMAGE:?}
    entrypoint: ["sh", "infra/rails-entrypoint.sh"]
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml", "-c", "3"]
    mem_limit: 512m
    cpus: 0.25
    environment:
      <<: *auth-env
      SERVICE_ROLE: sidekiq
    configs:
      - {source: main-db-ca, target: /run/configs/main-db-ca.pem}
    healthcheck:
      test: ["CMD", "ruby", "infra/sidekiq-health.rb"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  hablas-evo-staging-crm:
    <<: *common
    image: ${CRM_IMAGE:?Verified recipe image digest required}
    entrypoint: ["sh", "infra/rails-entrypoint.sh"]
    command: ["bundle", "exec", "rails", "server", "-b", "0.0.0.0", "-p", "3000"]
    mem_limit: 768m
    cpus: 0.5
    environment: *crm-env
    configs:
      - {source: main-db-ca, target: /run/configs/main-db-ca.pem}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  hablas-evo-staging-crm-sidekiq:
    <<: *common
    image: ${CRM_IMAGE:?}
    entrypoint: ["sh", "infra/rails-entrypoint.sh"]
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml", "-c", "3"]
    mem_limit: 512m
    cpus: 0.25
    environment: *crm-env
    configs:
      - {source: main-db-ca, target: /run/configs/main-db-ca.pem}
    healthcheck:
      test: ["CMD", "ruby", "infra/sidekiq-health.rb"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  hablas-evo-staging-core:
    <<: *common
    image: ${CORE_IMAGE:?Verified recipe image digest required}
    command: ["./main"]
    mem_limit: 256m
    cpus: 0.25
    environment:
      PORT: "5555"
      DB_HOST: ${MAIN_DB_HOST:?}
      DB_PORT: ${MAIN_DB_PORT:?}
      DB_NAME: ${MAIN_DB_NAME:?}
      DB_USER: ${MAIN_DB_USER:?}
      DB_PASSWORD: ${MAIN_DB_PASSWORD:?}
      DB_SSLMODE: verify-full
      PGSSLROOTCERT: /run/configs/main-db-ca.pem
      DB_MAX_IDLE_CONNS: "3"
      DB_MAX_OPEN_CONNS: "10"
      DB_CONN_MAX_LIFETIME: 1h
      DB_CONN_MAX_IDLE_TIME: 30m
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?}
      JWT_ALGORITHM: HS256
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?}
      EVO_AUTH_BASE_URL: ${AUTH_INTERNAL_ORIGIN:?}
      EVOLUTION_BASE_URL: ${CRM_INTERNAL_ORIGIN:?}
      AI_PROCESSOR_URL: ${PROCESSOR_INTERNAL_ORIGIN:?}
      AI_PROCESSOR_VERSION: v1
      FRONTEND_URL: ${FRONTEND_ORIGIN:?}
    configs:
      - {source: main-db-ca, target: /run/configs/main-db-ca.pem}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5555/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  hablas-evo-staging-processor:
    <<: *common
    image: ${PROCESSOR_IMAGE:?Verified recipe image digest required}
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000"]
    mem_limit: 1280m
    cpus: 0.75
    environment:
      POSTGRES_CONNECTION_STRING: ${MAIN_DB_DSN:?Percent-encoded TLS DSN with CA path required}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?}
      EVOAI_CRM_API_TOKEN: ${EVOAI_CRM_API_TOKEN:?}
      EVO_AUTH_BASE_URL: ${AUTH_INTERNAL_ORIGIN:?}
      EVO_AI_CRM_URL: ${CRM_INTERNAL_ORIGIN:?}
      CORE_SERVICE_URL: ${CORE_INTERNAL_ORIGIN:?}/api/v1
      REDIS_HOST: ${REDIS_HOST:?Observed data-resource DNS required}
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
      REDIS_DB: "1"
      REDIS_SSL: "false"
      REDIS_KEY_PREFIX: a2a_
      HOST: 0.0.0.0
      PORT: "8000"
      DEBUG: "false"
      APP_URL: ${API_ORIGIN:?}
      API_URL: ${API_ORIGIN:?}
      ARTIFACT_SERVICE_TYPE: minio
      ARTIFACT_ENDPOINT: ${ARTIFACT_ENDPOINT:?R2 endpoint hostname without scheme required}
      ARTIFACT_ACCESS_KEY: ${STORAGE_ACCESS_KEY_ID:?}
      ARTIFACT_SECRET_KEY: ${STORAGE_SECRET_ACCESS_KEY:?}
      ARTIFACT_SECURE: "true"
      ARTIFACT_REGION: auto
      ARTIFACT_FILES_BUCKET: ${STORAGE_BUCKET_NAME:?}
      ARTIFACT_SPEECH_BUCKET: ${STORAGE_BUCKET_NAME:?}
      ARTIFACT_AUTO_CREATE_BUCKETS: "false"
    configs:
      - {source: main-db-ca, target: /run/configs/main-db-ca.pem}
    volumes: ["processor-logs:/app/logs"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "4", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  hablas-evo-staging-bot:
    <<: *common
    image: ${BOT_IMAGE:?Verified recipe image digest required}
    mem_limit: 128m
    cpus: 0.25
    environment:
      LISTEN_ADDR: 0.0.0.0:8080
      REDIS_URL: ${BOT_REDIS_URL:?Authenticated Redis DB0 URI required}
      AI_PROCESSOR_URL: ${PROCESSOR_INTERNAL_ORIGIN:?}
      BOT_RUNTIME_SECRET: ${BOT_RUNTIME_SECRET:?}
      AI_CALL_TIMEOUT_SECONDS: "90"
      MEDIA_HOST_ALLOWLIST: ${MEDIA_HOST_ALLOWLIST:?Only verified media hosts required}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  hablas-evo-staging-evoflow:
    <<: *common
    image: ${EVOFLOW_IMAGE:?Verified TLS recipe image digest required}
    command: ["node", "dist/main.js"]
    mem_limit: 512m
    cpus: 0.5
    environment:
      NODE_ENV: production
      PORT: "3334"
      RUN_MODE: api
      QUEUE_MODE: direct
      STORAGE_MODE: clickhouse
      WRITE_MODE: ch-sync
      POSTGRES_DB_HOST: ${MAIN_DB_HOST:?}
      POSTGRES_DB_PORT: ${MAIN_DB_PORT:?}
      POSTGRES_DB_DATABASE: ${MAIN_DB_NAME:?}
      POSTGRES_DB_SCHEMA: hablas_evoflow_staging
      POSTGRES_DB_USERNAME: ${FLOW_DB_USER:?}
      POSTGRES_DB_PASSWORD: ${FLOW_DB_PASSWORD:?}
      POSTGRES_SSLMODE: verify-full
      PGSSLROOTCERT: /run/configs/main-db-ca.pem
      POSTGRES_POOL_MAX: "5"
      AUTH_APIKEY_INTEGRATION_LOCAL: ${AUTH_APIKEY_INTEGRATION_LOCAL:?}
      EVO_AUTH_SERVICE_URL: ${AUTH_INTERNAL_ORIGIN:?}
      EVO_AUTH_VALIDATE_TOKEN_ENDPOINT: /api/v1/auth/validate
      EVOAI_CRM_BASE_URL: ${CRM_INTERNAL_ORIGIN:?}
      EVOAI_CRM_API_TOKEN: ${EVOAI_CRM_API_TOKEN:?}
      REDIS_HOST: ${REDIS_HOST:?}
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
      REDIS_DB: "4"
      BROKER_TYPE: rabbitmq
      RABBITMQ_URL: ${RABBITMQ_URL:?Authenticated dedicated-vhost URI required}
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:?Observed data-resource DNS required}
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_DATABASE: hablas_evo_staging
      CLICKHOUSE_USERNAME: hablas_evo_staging
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?}
      CLICKHOUSE_TABLE: contact_events
    configs:
      - {source: main-db-ca, target: /run/configs/main-db-ca.pem}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "4", "http://127.0.0.1:3334/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

configs:
  main-db-ca:
    content: ${MAIN_DB_CA_PEM:?Certificate chain from verified Supabase settings required}

volumes:
  processor-logs:
    name: hablas-evo-staging-processor-logs
    labels:
      io.golevel.owner: ${DEPLOYMENT_OWNER:?}
