# Coolify Compose source of truth; no ports, external volumes or Swarm labels.
#
# RENAME NOTICE (staging -> production): the service, hostname and volume names below
# changed. Docker creates EMPTY volumes for the new names; it does not move data.
# Before deploying this file, follow docs/production-rename-runbook.md:
#   - Redis: drain Sidekiq and EvoFlow queues to zero, then copy hablas-evo-staging-redis
#     into hablas-evo-production-redis. An empty volume loses every pending job.
#   - RabbitMQ: RABBITMQ_NODENAME changed, so the previous Mnesia database is unreadable
#     even if copied. Export definitions from the old node and import into the new one
#     with publishers stopped and queues drained.
#   - ClickHouse: copy hablas-evo-staging-clickhouse into hablas-evo-production-clickhouse,
#     then rename the database and recreate the user grants. An empty volume loses every
#     EvoFlow contact event.
name: hablas-evo-data-production
x-common: &common
  platform: linux/amd64
  restart: "on-failure:3"
  stop_grace_period: 60s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  labels:
    io.golevel.project: hablas-evo-infra
    io.golevel.environment: production
    io.golevel.owner: ${DEPLOYMENT_OWNER:?Ownership marker required}

services:
  hablas-evo-production-redis:
    <<: *common
    image: ${REDIS_IMAGE:?Use verified image@sha256 digest}
    mem_limit: 512m
    cpus: 0.25
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Dedicated credential required}
    command: ["sh", "-ec", 'exec redis-server /usr/local/etc/redis/redis.conf --requirepass "$${REDIS_PASSWORD}"']
    configs:
      - source: redis-config
        target: /usr/local/etc/redis/redis.conf
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -qx PONG']
      interval: 20s
      timeout: 5s
      retries: 3

  hablas-evo-production-rabbitmq:
    <<: *common
    image: ${RABBITMQ_IMAGE:?Use verified image@sha256 digest}
    hostname: hablas-evo-production-rabbitmq
    mem_limit: 512m
    cpus: 0.25
    environment:
      RABBITMQ_NODENAME: rabbit@hablas-evo-production-rabbitmq
      RABBITMQ_DEFAULT_USER: hablas-evo-production
      RABBITMQ_DEFAULT_VHOST: hablas-evo-production
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Dedicated credential required}
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:?Stable recovery secret required}
    configs:
      - source: rabbitmq-config
        target: /etc/rabbitmq/rabbitmq.conf
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  hablas-evo-production-clickhouse:
    <<: *common
    image: ${CLICKHOUSE_IMAGE:?Use verified image@sha256 digest}
    mem_limit: 1536m
    cpus: 0.5
    environment:
      CLICKHOUSE_DB: hablas_evo_production
      CLICKHOUSE_USER: hablas_evo_production
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Dedicated credential required}
    configs:
      - source: clickhouse-config
        target: /etc/clickhouse-server/config.d/hablas-evo.xml
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", 'clickhouse-client --user hablas_evo_production --password "$(printenv CLICKHOUSE_PASSWORD)" --query "SELECT 1" >/dev/null']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

configs:
  redis-config:
    file: ../redis/redis.conf
  rabbitmq-config:
    file: ../rabbitmq/rabbitmq.conf
  clickhouse-config:
    file: ../clickhouse/config-overrides.xml

volumes:
  redis-data:
    name: hablas-evo-production-redis
    labels:
      io.golevel.owner: ${DEPLOYMENT_OWNER:?Ownership marker required}
  rabbitmq-data:
    name: hablas-evo-production-rabbitmq
    labels:
      io.golevel.owner: ${DEPLOYMENT_OWNER:?Ownership marker required}
  clickhouse-data:
    name: hablas-evo-production-clickhouse
    labels:
      io.golevel.owner: ${DEPLOYMENT_OWNER:?Ownership marker required}
