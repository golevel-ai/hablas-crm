# Coolify Compose source of truth for the remotely managed Cloudflare Tunnel connectors.
#
# This stack replaces the public A record for api-crm.hablas.chat. Once both
# connectors are healthy and the DNS route points at the tunnel, inbound ports
# 80 and 443 can be closed on the origin firewall; cloudflared only makes
# outbound connections. See docs/production-rename-runbook.md.
#
# Two connectors run the same tunnel so that a restart or a failed container
# never takes the API offline. Cloudflare load balances across connectors.
name: hablas-evo-tunnel-production

x-connector: &connector
  image: ${CLOUDFLARED_IMAGE:?Use verified image@sha256 digest}
  platform: linux/amd64
  restart: unless-stopped
  stop_grace_period: 30s
  mem_limit: 256m
  cpus: 0.25
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  user: "65532:65532"
  command: ["tunnel", "--no-autoupdate", "run", "--token", "${TUNNEL_TOKEN:?Tunnel token required}"]
  environment:
    TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Tunnel token required}
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  labels:
    io.golevel.project: hablas-evo-infra
    io.golevel.environment: production
    io.golevel.owner: ${DEPLOYMENT_OWNER:?Ownership marker required}
  healthcheck:
    test: ["CMD", "cloudflared", "--version"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 30s

services:
  hablas-evo-production-tunnel-a:
    <<: *connector

  hablas-evo-production-tunnel-b:
    <<: *connector
